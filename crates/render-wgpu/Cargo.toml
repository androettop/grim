[package]
name = "grim-render-wgpu"
description = "wgpu backend for grim-render (desktop GPU, with offscreen rendering)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
grim-render.workspace = true
wgpu = "30.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"

# WebGL 2 for the browsers without WebGPU.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", features = ["webgl"] }
